[workspace]
resolver = "3"

members = [
    "christina",
    "christina-core", "ui-extractable",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1.0.100"
thiserror = "2.0.18"
compact_str = { version = "0.9", features = ["serde"] }
tokio = { version = "1.49.0", default-features = false, features = ["rt-multi-thread", "time", "macros", "sync", "test-util"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
schemars = "1.0"
git2 = { version = "0.20.3", default-features = false }
parking_lot = "0.12.5"
regex = { version = "1.12.2", default-features = false, features = ["std", "perf", "unicode-perl"] }
url = { version = "2.5.8", features = ["serde"] }
tempfile = "3.10.1"
tracing = "0.1.44"
criterion = { version = "0.8", features = ["html_reports"] }
tiktoken-rs = "0.11.0"
moka = { version = "0.12", features = ["sync"] }
ahash = "0.8"
memchr = "2.7"
proptest = "1.6.0"

[workspace.lints.rust]
# Unsafe code must stay out of production code paths. Tests that need unsafe
# std::env mutation opt in locally with a narrow allow.
unsafe_code = "deny"

# Dropped Results and Futures are usually lost work or lost failures in a CLI.
unused_must_use = "warn"

# Keep the dependency tree lean; unused crates slow CI and increase binary size.
unused_crate_dependencies = "warn"

[workspace.lints.clippy]
# Avoid runtime crashes in production code. Tests can opt in locally when
# panicking assertions make the case clearer.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

# Make shallow pointer clones explicit as Arc::clone/Rc::clone.
clone_on_ref_ptr = "warn"

# Large futures and enum variants can bloat stacks and async state machines.
large_futures = "warn"
large_enum_variant = "warn"

# Warn on APIs that advertise failure without ever failing.
unnecessary_wraps = "warn"

# Temporary debug code should not slip into release builds.
todo = "warn"
dbg_macro = "warn"

# Christina keeps descriptive type names in modules with broad public tests, so
# Azalea's stricter setting would create churn without improving ownership.
module_name_repetitions = "allow"

[profile.dev]
opt-level = 0
debug = true
split-debuginfo = "unpacked"
panic = "unwind"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.test]
opt-level = 1

[profile.dist]
inherits = "release"
