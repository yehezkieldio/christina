schema_version = 2

[standard]
active_profile = "default"
commit_message_validation_mode = "soft"
ignore_files = []

# Advanced settings
lockfile_token_limit = 100
use_commit_history = true
commit_history_depth = 5
max_concurrent_requests = 4
max_partial_failure_rate = 0.10
prompt_failure_rate_threshold = 0.05

[experimental]
use_experimental = false

[profiles.azure]
name = "azure"
provider = "azure"
model = "gpt-4"
api_key = { env = "AZURE_OPENAI_API_KEY" }
api_url = "https://your-resource.openai.azure.com/openai/deployments/gpt-4/chat/completions"
azure_api_version = "2024-12-01-preview"
azure_deployment_id = "gpt-4"
max_input_tokens = 256000
max_output_tokens = 8192
temperature = 0.3
reasoning_effort = "low"

[profiles.large-context]
name = "large-context"
provider = "azure"
model = "gpt-4o"
api_key = { env = "AZURE_OPENAI_API_KEY" }
api_url = "https://your-resource.openai.azure.com/openai/deployments/gpt-4o/chat/completions"
azure_api_version = "2024-12-01-preview"
azure_deployment_id = "gpt-4o"
max_input_tokens = 512000
max_output_tokens = 16384
temperature = 0.3
reasoning_effort = "low"
