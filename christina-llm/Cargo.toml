[package]
name = "christina-llm"
version = "0.1.0"
description = "LLM orchestration for Christina."
edition = "2024"

[dependencies]
christina-core = { path = "../christina-core" }
llm = { version = "1.3.7", default-features = false, features = ["rustls-tls", "azure_openai", "groq", "openai", "openrouter", "mistral"] }
tiktoken-rs = { version = "0.9.1", default-features = false }
tokio = { workspace = true }
futures = { version = "0.3.31", default-features = false, features = ["std"] }
thiserror = { workspace = true }
anyhow = { workspace = true }
url = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
parking_lot = "0.12.5"
lru = "0.16.3"

[lints]
workspace = true
