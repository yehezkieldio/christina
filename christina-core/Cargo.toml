[package]
name = "christina-core"
version = "0.1.0"
description = "Core domain logic, types, and shared utilities for Christina."
edition = "2024"

[[bin]]
name = "generate-json-schema"
path = "src/bin/generate_json_schema.rs"
required-features = ["jsonschema"]

[dependencies]
ahash = { workspace = true }
anyhow = { workspace = true }
compact_str = { workspace = true }
git2 = { workspace = true, optional = true }
keyring = { version = "3", optional = true }
memchr = { workspace = true }
moka = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
thiserror = { workspace = true }
tiktoken-rs = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
zeroize = { version = "1.8", features = ["alloc", "derive"] }

[dev-dependencies]
git2 = { workspace = true }
proptest = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
tempfile = { workspace = true }
criterion = { workspace = true }
tokio = { workspace = true }

[features]
default = ["keyring-support"]
git2-support = ["dep:git2"]
keyring-support = ["keyring"]
test-helpers = ["dep:tempfile", "dep:git2"]
jsonschema = ["dep:schemars", "dep:serde_json"]

[[bench]]
name = "tokenizer_bench"
harness = false

[lints]
workspace = true
