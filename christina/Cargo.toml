[package]
name = "christina"
version = "0.1.0"
description = "AI-powered conventional commit message generator."
edition = "2024"
repository = "https://github.com/yehezkieldio/christina"
homepage = "https://github.com/yehezkieldio/christina"
default-run = "christina"

[[bin]]
name = "christina"
path = "src/main.rs"

[dependencies]
christina-core = { path = "../christina-core" }
llm = { version = "1.3.7", default-features = false, features = ["rustls-tls", "azure_openai"] }
anyhow = { workspace = true }
thiserror = { workspace = true }
clap = { version = "4.5.55", default-features = false, features = ["std", "derive", "help", "usage"] }
clap_complete = "4.5"
git2 = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { version = "1.0.0", default-features = false, features = ["parse", "display"] }
config = { version = "0.15.19", default-features = false, features = ["toml"] }
directories = "6.0.0"
mimalloc = { version = "0.1.48", default-features = false }
cap = { version = "0.1.2", features = ["stats"] }
url = { workspace = true }
dhat = { version = "0.3.3", optional = true }
futures = "0.3.31"
fs2 = "0.4.3"
moka = { version = "0.12", features = ["sync"] }
ahash = "0.8"
tiktoken-rs = "0.11.0"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
console = "0.16"
indicatif = "0.18"
dialoguer = "0.12"
memchr = "2.7"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
rustyline = { version = "18", features = ["custom-bindings"] }

[dev-dependencies]
christina-core = { path = "../christina-core", features = ["test-helpers"] }
proptest = "1.6.0"
criterion = { workspace = true }

# NOTE: Benches temporarily disabled during migration
# [[bench]]
# name = "chunking_bench"
# harness = false

# [[bench]]
# name = "diff_processor_bench"
# harness = false

# [[bench]]
# name = "tokenizer_service_bench"
# harness = false

[lints]
workspace = true

# Christina will be distributed via NPM, via prebuilt binaries, except for development or debugging only features
# We don't have feature-gated dependencies for now, will be not needed foreseeably
[features]
default = []
dhat-heap = ["dhat"]
