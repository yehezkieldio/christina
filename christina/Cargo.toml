[package]
name = "christina"
version = "0.1.0"
description = "AI-powered conventional commit message generator."
edition = "2024"
repository = "https://github.com/yehezkieldio/christina"
homepage = "https://github.com/yehezkieldio/christina"
default-run = "christina"

[[bin]]
name = "christina"
path = "src/main.rs"

[dependencies]
christina-core = { path = "../christina-core" }
llm = { version = "1.3.7", default-features = false, features = ["rustls-tls", "azure_openai", "groq", "openai"] }
anyhow = { workspace = true }
clap = { version = "4.5.55", default-features = false, features = ["std", "derive", "help", "usage"] }
clap_complete = "4.5"
git2 = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { version = "0.9.11", default-features = false, features = ["parse", "display"] }
config = { version = "0.15.19", default-features = false, features = ["toml"] }
directories = "6.0.0"
mimalloc = { version = "0.1.48", default-features = false }
cap = { version = "0.1.2" }
url = { workspace = true }
dhat = { version = "0.3.3", optional = true }
futures = "0.3.31"
fs2 = "0.4.3"
keyring = { version = "3", optional = true }
moka = { version = "0.12", features = ["sync"] }
ahash = "0.8"
tiktoken-rs = "0.9.1"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
console = "0.15"
indicatif = "0.17"
dialoguer = "0.11"
memchr = "2.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[dev-dependencies]
christina-core = { path = "../christina-core", features = ["test-helpers"] }
proptest = "1.6.0"
criterion = { workspace = true }

[[bench]]
name = "chunking_bench"
harness = false

[[bench]]
name = "diff_processor_bench"
harness = false

[[bench]]
name = "tokenizer_service_bench"
harness = false

[lints]
workspace = true

# Christina will be distributed via NPM, via prebuilt binaries, except for development or debugging only features
# We don't have feature-gated dependencies for now, will be not needed foreseeably
[features]
default = ["keyring-support"]
dhat-heap = ["dhat"]
keyring-support = ["christina-core/keyring-support", "dep:keyring"]
